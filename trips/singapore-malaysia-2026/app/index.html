<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Singapore + Malaysia 2026 — Voyager Docket</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#0a0e17" />
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-surface-container-lowest text-on-surface font-body antialiased selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">
  <div aria-hidden="true" class="fixed -top-96 left-0 opacity-0 pointer-events-none select-none">
    <span class="font-body font-normal">a</span><span class="font-body font-bold">a</span>
    <span class="font-label font-bold">a</span><span class="material-symbols-outlined">flight_takeoff</span>
  </div>
  <div id="offline-banner" class="hidden fixed top-0 inset-x-0 z-[70] bg-amber-500/90 text-surface-container-lowest text-[11px] font-label font-bold py-1 px-3 text-center">
    OFFLINE MODE · CACHED DOCKET ACTIVE
  </div>

  <div id="app-root" class="min-h-screen w-full"></div>

  <dialog id="app-modal" class="bg-transparent border-0 p-0 m-0 max-w-none w-full h-full backdrop:bg-surface-container-lowest/60 backdrop:backdrop-blur-[2px]"></dialog>
  <input type="file" id="csv-file-input" accept=".csv,text/csv" class="hidden" />

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.min.js"></script>
  <script src="js/trip-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
